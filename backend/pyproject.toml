# The server of the application: accounts, studies, and what lets workshop 2 compute for real.
#
#     uv sync          # in this directory
#
# Two things live in this one environment.
#
# The application server (app/, started by serve.py): FastAPI, SQLAlchemy and
# Alembic over SQLite or PostgreSQL, Argon2 for the passwords.
#
# PyBigDFT WITHOUT BigDFT (pure Python): the study engine writes the inputs and
# reads the logs here; the dry run and the calculation go to the two HAPS
# through the MCP bridge (haps_bridge/, started by ./bridge.sh from this same
# environment). Pinned to the version the pack runs: the dry run
# checks what this version writes against BigDFT 1.9.1.

[project]
name = "ondelette-backend"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pybigdft==1.9.6.1",
    "mcp>=2,<3",          # the client of the bridge, and the bridge itself; haps_dryrun_client.py is written for 2.x
    "haps-client>=0.5.0", # haps_bridge/: submits to ebservice, moves files through ebuffer
    "pyyaml",
    "ase",                # xyz_downloader.py: reads PubChem's SDF
    "requests",           # xyz_downloader.py: asks PubChem
    # the application server
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# uv sync --extra postgres, then ONDELETTE_DATABASE_URL=postgresql+psycopg://…
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.10", "ruff>=0.5", "types-pyyaml"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["haps", "preview", "xyz_downloader", "argon2.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 180
target-version = "py311"
extend-exclude = ["haps_bridge", "bigdft_bin", "haps_dryrun_client.py", "xyz_downloader.py", "work", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]        # Depends(...) in a signature is how FastAPI is written
