# The migrations of the application's database.
#
#     uv run alembic upgrade head                        # bring the database up to date (a new one: create it)
#     uv run alembic revision --autogenerate -m "…"      # after a change of app/models.py: write the migration, then read it
#     uv run alembic downgrade -1                        # undo the last one
#
# The address of the database is not written here: migrations/env.py takes it
# from the settings of the application (ONDELETTE_DATABASE_URL, or backend/.env).

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
