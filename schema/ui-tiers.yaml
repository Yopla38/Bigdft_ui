# Curation of the 313 BigDFT input variables for the interface.
#
# The variables themselves (names, defaults, ranges, conditions) are NOT listed
# here: they are extracted from the BigDFT source by tools/extract_schema.py.
# This file only answers two product questions for each variable:
#   - which building block of the workshop owns it;
#   - at which depth it is shown: essential (a control on the block),
#     advanced (one click away), expert (searchable, never hidden).
# Anything not listed is "expert" and inherits its block from its section.
# tools/build_prototype_schema.py fails if a path below does not exist upstream.

blocks:
  matter:      {label: Matter,      role: "Atoms, cell, boundary conditions, fragments"}
  theory:      {label: Theory,      role: "Level of description: functional, spin, charge, dispersion"}
  accuracy:    {label: Accuracy,    role: "Wavelet grid, convergence, cubic or linear-scaling algorithm"}
  environment: {label: Environment, role: "k-points, implicit solvent, electric field, electronic temperature"}
  task:        {label: Task,        role: "What is done: energy, relaxation, dynamics, path, excitations"}
  observables: {label: Observables, role: "What is looked at: density, orbitals, DOS, charges, dipole"}
  machine:     {label: Machine,     role: "Where it runs: container, cores, GPU, budget"}

# Default block of every section (namespace.section).
sections:
  bigdft.dft: accuracy
  bigdft.output: observables
  bigdft.kpt: environment
  bigdft.geopt: task
  bigdft.md: task
  bigdft.mix: accuracy
  bigdft.sic: theory
  bigdft.tddft: task
  bigdft.mode: theory
  bigdft.perf: machine
  bigdft.lin_general: accuracy
  bigdft.lin_basis: accuracy
  bigdft.lin_kernel: accuracy
  bigdft.lin_basis_params: accuracy
  psolver.kernel: environment
  psolver.environment: environment
  psolver.setup: machine
  chess.foe: accuracy
  chess.lapack: machine
  chess.ntpoly: accuracy

# Variables whose block differs from their section's default.
overrides:
  theory: [bigdft.dft.ixc, bigdft.dft.nspin, bigdft.dft.mpol, bigdft.dft.qcharge, bigdft.dft.dispersion,
            bigdft.dft.alpha_hf, bigdft.dft.magnetic_torque, bigdft.dft.spin_dynamics,
            bigdft.dft.occupancy_control, bigdft.dft.projection]
  environment:  [bigdft.dft.elecfield, bigdft.dft.external_potential, bigdft.mix.tel, bigdft.mix.occopt,
            bigdft.dft.disablesym]
  task:  [bigdft.dft.norbv, bigdft.dft.nvirt, bigdft.dft.gnrm_cv_virt, bigdft.dft.itermax_virt]
  observables: [bigdft.dft.output_denspot, bigdft.dft.nplot, bigdft.dft.plot_pot_axes, bigdft.dft.plot_mppot_axes,
            bigdft.dft.calculate_strten, bigdft.perf.calculate_forces, bigdft.perf.calculate_gap,
            bigdft.perf.foe_gap, bigdft.perf.loewdin_charge_analysis, bigdft.perf.coeff_weight_analysis,
            bigdft.perf.wf_extent_analysis, bigdft.lin_general.calc_dipole, bigdft.lin_general.calc_quadrupole,
            bigdft.lin_general.charge_multipoles, bigdft.lin_general.support_function_multipoles,
            bigdft.lin_general.output_wf, bigdft.lin_general.output_mat, bigdft.lin_general.output_coeff,
            bigdft.lin_general.output_fragments, bigdft.lin_general.calculate_FOE_eigenvalues]

